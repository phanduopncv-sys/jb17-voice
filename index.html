<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JB17 GenAI Voice Studio</title>

    <!-- FONT GENAI STYLE -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <!-- MAIN CSS -->
    <link rel="stylesheet" href="styles.css" />
</head>

<body>

    <div class="app">

        <!-- ================= SIDEBAR ================= -->
        <aside class="sidebar">
            <div class="sidebar-title">JB17 Max</div>

            <nav class="side-menu">
                <button class="side-btn active" data-tab="studio">🎤 Văn bản thành giọng nói</button>
                <button class="side-btn" data-tab="history">📜 Lịch sử</button>
                <button class="side-btn" data-tab="clone">🧬 Voice Clone</button>
            </nav>

            <div class="credit-box">
                <div class="credit-label">Credits còn lại</div>
                <div id="creditAmount" class="credit-value">Đang tải...</div>
            </div>
        </aside>

        <!-- ================= MAIN CONTENT ================= -->
        <main class="main">

            <!-- ######## TAB: STUDIO ######## -->
            <section id="studio" class="tab active">

                <h2 class="tab-title">Văn bản thành giọng nói</h2>

                <div class="studio-layout">

                    <!-- LEFT: TEXT INPUT -->
                    <div class="studio-left">
                        <textarea id="inputText" placeholder="Nhập nội dung..."></textarea>

                        <div class="textarea-footer">
                            <span id="charCount">0</span> ký tự
                        </div>

                        <button id="generateBtn" class="btn-generate">Tạo giọng nói</button>

                        <div id="outputContainer"></div>
                    </div>

                    <!-- RIGHT: CONTROL PANEL -->
                    <div class="studio-right">

                        <div class="control-card">
                            <label>Chọn Voice</label>
                            <select id="voiceSelect"></select>
                        </div>

                        <div class="control-card">
                            <label>Model</label>
                            <select id="modelSelect">
                                <option value="eleven_monolingual_v1">Monolingual v1</option>
                                <option value="eleven_multilingual_v2">Multilingual v2</option>
                            </select>
                        </div>

                        <!-- SLIDERS -->
                        <div class="control-card">
                            <label>Speed</label>
                            <input id="speed" type="range" min="0.5" max="2" step="0.01" value="1.0" />
                        </div>

                        <div class="control-card">
                            <label>Stability</label>
                            <input id="stability" type="range" min="0" max="1" step="0.01" value="1" />
                        </div>

                        <div class="control-card">
                            <label>Similarity</label>
                            <input id="similarity" type="range" min="0" max="1" step="0.01" value="1" />
                        </div>

                        <div class="control-card">
                            <label>Style</label>
                            <input id="style" type="range" min="0" max="1" step="0.01" value="0" />
                        </div>

                        <button id="previewBtn" class="btn-preview">Preview</button>

                    </div>

                </div>

            </section>

            <!-- ######## TAB: HISTORY ######## -->
            <section id="history" class="tab">
                <h2 class="tab-title">Lịch sử tạo giọng nói</h2>
                <div id="historyList"></div>

                <button id="clearHistoryBtn" class="btn-clear">Xoá tất cả lịch sử</button>
            </section>

            <!-- ######## TAB: VOICE CLONE ######## -->
            <section id="clone" class="tab">
                <h2 class="tab-title">Clone giọng nói</h2>

                <div class="clone-card">
                    <label>Tải file giọng mẫu (MP3/WAV)</label>
                    <input type="file" accept="audio/*" class="clone-input" />

                    <button class="btn-clone">Tải lên & clone giọng</button>
                </div>

            </section>

        </main>

    </div>

    <!-- MAIN SCRIPT -->
    <script src="main.js"></script>

</body>
</html>
