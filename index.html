<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JB17 Voice Studio</title>

    <link rel="stylesheet" href="styles.css">

    <style>
        body {
            background: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            display: flex;
            justify-content: space-between;
            padding: 15px 30px;
            background: #000;
            border-bottom: 1px solid #222;
            font-size: 18px;
        }

        header nav a {
            color: #ccc;
            margin-right: 20px;
            text-decoration: none;
        }

        header nav a:hover {
            color: #fff;
        }

        .container {
            padding: 30px;
            display: flex;
            gap: 30px;
        }

        .card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
        }

        #voiceCard {
            width: 30%;
        }

        #studioCard {
            width: 70%;
        }

        select, input, textarea {
            width: 100%;
            padding: 10px;
            margin: 5px 0 15px 0;
            background: #000;
            border: 1px solid #333;
            color: #fff;
            border-radius: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            background: #3498db;
            color: #fff;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        .queue-item {
            background: #000;
            padding: 10px;
            border-radius: 5px;
            margin: 8px 0;
            display: flex;
            justify-content: space-between;
        }

        #apiStatusBox {
            padding: 8px 0;
            font-size: 14px;
        }

        #historySection {
            margin-top: 40px;
            padding: 20px;
            background: #1a1a1a;
            border-radius: 10px;
        }
    </style>
</head>

<body>

<header>
    <div>JB17 Voice Studio</div>
    <nav>
        <a href="#studio">Studio</a>
        <a href="#history">History</a>
        <a href="#settings">Settings</a>
    </nav>
</header>

<div class="container">

    <!-- ===================== VOICE SETTINGS ===================== -->
    <div class="card" id="voiceCard">
        <h2>Voice Settings</h2>

        <label>Model</label>
        <select id="modelSelect">
            <option value="eleven_monolingual_v1">Eleven Monolingual v1</option>
            <option value="eleven_multilingual_v2">Eleven Multilingual v2</option>
        </select>

        <label>Speed</label>
        <input type="range" id="speed" min="0.5" max="2.0" step="0.01" value="1.0">
        <div id="speedVal">1.0</div>

        <label>Stability</label>
        <input type="range" id="stability" min="0" max="1" step="0.01" value="1.0">
        <div id="stabilityVal">1.0</div>

        <label>Similarity</label>
        <input type="range" id="similarity" min="0" max="1" step="0.01" value="1.0">
        <div id="similarityVal">1.0</div>

        <label>Style Exaggeration</label>
        <input type="range" id="style" min="0" max="1" step="0.01" value="0">
        <div id="styleVal">0</div>
    </div>

    <!-- ===================== STUDIO AREA ===================== -->
    <div class="card" id="studioCard">
        <h2>Studio</h2>

        <div id="apiStatusBox">Checking API...</div>

        <label>Select Voice</label>
        <select id="taskVoiceSelect"></select>

        <label>Or enter custom Voice ID:</label>
        <input id="customVoiceId" placeholder="Enter ElevenLabs Voice ID...">

        <button id="previewVoiceBtn">Preview Voice</button>

        <label>Enter text</label>
        <textarea id="inputText" rows="6" placeholder="Type or paste your text here..."></textarea>

        <button id="addToQueueBtn">+ Add to Queue</button>

        <h3>Queue</h3>
        <div id="queueContainer"></div>
    </div>
</div>

<!-- ===================== HISTORY SECTION ===================== -->
<div id="historySection">
    <h2>History</h2>
    <button id="clearHistoryBtn" style="background:#c0392b;">Clear All History</button>
</div>

<script src="main.js"></script>

</body>
</html>
