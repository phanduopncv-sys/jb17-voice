<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JB17 Voice Studio</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="app-container">

        <!-- SIDEBAR GENAI PRO STYLE -->
        <aside class="sidebar">
            <div class="sidebar-title">JB17 Voice Studio</div>

            <nav class="sidebar-menu">
                <button class="menu-btn active" data-tab="studio">🎙️ Văn bản thành giọng nói</button>
                <button class="menu-btn" data-tab="history">🕒 Lịch sử</button>
                <button class="menu-btn" data-tab="settings">⚙️ Cài đặt</button>
            </nav>
        </aside>

        <!-- MAIN CONTENT -->
        <main class="main-content">

            <!-- ======================= STUDIO TAB ======================= -->
            <section id="studio" class="tab-section active">

                <h2 class="tab-title">Studio</h2>

                <div class="studio-flex">

                    <!-- LEFT: INPUT TEXT AREA -->
                    <div class="text-box">
                        <textarea id="inputText" placeholder="Nhập nội dung cần tạo giọng nói..."></textarea>
                        <div class="char-count"><span id="charCount">0</span> ký tự</div>
                        <button id="generateBtn" class="primary-btn full-width">Tạo giọng nói</button>
                    </div>

                    <!-- RIGHT: CONTROLS -->
                    <div class="control-panel">

                        <div class="panel-box">
                            <label class="panel-label">Credits</label>
                            <div id="creditStatus" class="credit-box">Checking...</div>
                        </div>

                        <div class="panel-box">
                            <label class="panel-label">Voice</label>
                            <select id="voiceSelect" class="input-select"></select>
                        </div>

                        <div class="panel-box">
                            <label class="panel-label">Model</label>
                            <select id="modelSelect" class="input-select">
                                <option value="eleven_multilingual_v2">Multilingual v2</option>
                                <option value="eleven_turbo_v2">Turbo v2</option>
                            </select>
                        </div>

                        <!-- SLIDERS -->
                        <div class="panel-box">
                            <label>Speed</label>
                            <input id="speed" type="range" min="0.5" max="2" step="0.01" value="1.0">
                        </div>

                        <div class="panel-box">
                            <label>Stability</label>
                            <input id="stability" type="range" min="0" max="1" step="0.01" value="1">
                        </div>

                        <div class="panel-box">
                            <label>Similarity</label>
                            <input id="similarity" type="range" min="0" max="1" step="0.01" value="1">
                        </div>

                        <div class="panel-box">
                            <label>Style Exaggeration</label>
                            <input id="style" type="range" min="0" max="1" step="0.01" value="0">
                        </div>

                    </div>

                </div>
            </section>

            <!-- ======================= HISTORY TAB ======================= -->
            <section id="history" class="tab-section">
                <h2 class="tab-title">Lịch sử</h2>

                <div id="historyList" class="history-list"></div>

                <button id="clearHistoryBtn" class="danger-btn">Xóa tất cả lịch sử</button>
            </section>

            <!-- ======================= SETTINGS TAB ======================= -->
            <section id="settings" class="tab-section">
                <h2 class="tab-title">Cài đặt</h2>

                <div class="settings-box">
                    <label>Worker Endpoint</label>
                    <input id="workerEndpoint" type="text" class="input-text" placeholder="https://tts.example.workers.dev" />
                </div>

                <button id="saveSettingsBtn" class="primary-btn">Lưu thay đổi</button>
            </section>

        </main>
    </div>

    <script src="main.js"></script>
    <script src="settings.js"></script>

</body>
</html>
